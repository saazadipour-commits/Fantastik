<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>LUXORA — The World's Finest Marketplace</title>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@300;400;600;700&family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
<style>
  /* ============ RESET & BASE ============ */
  * { margin: 0; padding: 0; box-sizing: border-box; }
  :root {
    --gold: #d4af37;
    --gold-light: #f4e4a6;
    --gold-dark: #a8842c;
    --black: #0a0a0a;
    --charcoal: #141414;
    --charcoal-2: #1c1c1c;
    --cream: #f8f5ee;
    --text-muted: #a8a8a8;
    --border: rgba(212, 175, 55, 0.18);
    --font-serif: 'Cormorant Garamond', serif;
    --font-sans: 'Inter', sans-serif;
  }
  html { scroll-behavior: smooth; }
  body {
    font-family: var(--font-sans);
    background: var(--black);
    color: var(--cream);
    overflow-x: hidden;
    line-height: 1.6;
  }
  a { text-decoration: none; color: inherit; }
  img { display: block; max-width: 100%; }
  ::selection { background: var(--gold); color: var(--black); }

  /* Scrollbar */
  ::-webkit-scrollbar { width: 10px; }
  ::-webkit-scrollbar-track { background: var(--charcoal); }
  ::-webkit-scrollbar-thumb { background: var(--gold-dark); border-radius: 10px; }
  ::-webkit-scrollbar-thumb:hover { background: var(--gold); }

  /* ============ NAVBAR ============ */
  .navbar {
    position: fixed; top: 0; left: 0; right: 0;
    z-index: 1000;
    padding: 22px 60px;
    display: flex; align-items: center; justify-content: space-between;
    transition: all 0.4s ease;
    background: transparent;
  }
  .navbar.scrolled {
    background: rgba(10, 10, 10, 0.85);
    backdrop-filter: blur(20px);
    border-bottom: 1px solid var(--border);
    padding: 14px 60px;
  }
  .logo {
    font-family: var(--font-serif);
    font-size: 30px; font-weight: 700;
    letter-spacing: 4px;
    background: linear-gradient(135deg, var(--gold-light), var(--gold), var(--gold-dark));
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
    background-clip: text;
  }
  .logo span { font-size: 14px; letter-spacing: 6px; display: block; margin-top: -6px; opacity: 0.7; }
  .nav-links { display: flex; gap: 40px; align-items: center; }
  .nav-links a {
    font-size: 14px; letter-spacing: 1.5px; text-transform: uppercase;
    color: var(--cream); position: relative; transition: color 0.3s;
  }
  .nav-links a::after {
    content: ''; position: absolute; left: 0; bottom: -6px;
    width: 0; height: 1px; background: var(--gold);
    transition: width 0.4s ease;
  }
  .nav-links a:hover { color: var(--gold); }
  .nav-links a:hover::after { width: 100%; }
  .nav-actions { display: flex; gap: 20px; align-items: center; }
  .icon-btn {
    width: 44px; height: 44px; border-radius: 50%;
    border: 1px solid var(--border);
    display: flex; align-items: center; justify-content: center;
    cursor: pointer; transition: all 0.3s; background: transparent; color: var(--cream);
  }
  .icon-btn:hover { border-color: var(--gold); color: var(--gold); transform: translateY(-2px); }
  .btn-gold {
    padding: 14px 32px; border-radius: 50px;
    background: linear-gradient(135deg, var(--gold-light), var(--gold), var(--gold-dark));
    color: var(--black); font-weight: 600; letter-spacing: 1.5px;
    font-size: 13px; text-transform: uppercase; border: none; cursor: pointer;
    transition: all 0.4s ease; box-shadow: 0 8px 24px rgba(212, 175, 55, 0.25);
  }
  .btn-gold:hover { transform: translateY(-3px); box-shadow: 0 12px 32px rgba(212, 175, 55, 0.45); }
  .menu-toggle { display: none; }

  /* ============ HERO ============ */
  .hero {
    min-height: 100vh;
    display: flex; align-items: center; justify-content: center;
    text-align: center;
    position: relative;
    padding: 120px 40px 60px;
    overflow: hidden;
    background:
      radial-gradient(ellipse at 20% 30%, rgba(212, 175, 55, 0.13) 0%, transparent 55%),
      radial-gradient(ellipse at 80% 70%, rgba(212, 175, 55, 0.09) 0%, transparent 55%),
      var(--black);
  }
  .hero::before {
    content: ''; position: absolute; inset: 0;
    background-image:
      linear-gradient(rgba(212, 175, 55, 0.04) 1px, transparent 1px),
      linear-gradient(90deg, rgba(212, 175, 55, 0.04) 1px, transparent 1px);
    background-size: 60px 60px;
    mask-image: radial-gradient(ellipse at center, black 20%, transparent 75%);
  }
  .hero-content { position: relative; z-index: 2; max-width: 1000px; }
  .hero-badge {
    display: inline-flex; align-items: center; gap: 10px;
    padding: 10px 22px; border-radius: 50px;
    border: 1px solid var(--border);
    background: rgba(212, 175, 55, 0.05);
    font-size: 12px; letter-spacing: 3px; text-transform: uppercase;
    color: var(--gold-light);
    margin-bottom: 32px;
    animation: fadeUp 0.8s ease 0.1s both;
  }
  .hero-badge .dot {
    width: 8px; height: 8px; border-radius: 50%;
    background: var(--gold);
    box-shadow: 0 0 12px var(--gold);
    animation: pulse 2s infinite;
  }
  @keyframes pulse {
    0%, 100% { opacity: 1; transform: scale(1); }
    50% { opacity: 0.5; transform: scale(1.3); }
  }
  .hero h1 {
    font-family: var(--font-serif);
    font-size: clamp(48px, 8vw, 108px);
    font-weight: 600; line-height: 1; letter-spacing: -1px;
    animation: fadeUp 0.9s ease 0.25s both;
  }
  .hero h1 .italic {
    font-style: italic; font-weight: 300;
    background: linear-gradient(135deg, var(--gold-light), var(--gold), var(--gold-dark));
    -webkit-background-clip: text; -webkit-text-fill-color: transparent;
  }
  .hero p {
    max-width: 640px; margin: 32px auto 0;
    font-size: 17px; color: var(--text-muted); letter-spacing: 0.5px;
    animation: fadeUp 0.9s ease 0.4s both;
  }
  .hero-cta {
    margin-top: 46px; display: flex; gap: 20px; justify-content: center; flex-wrap: wrap;
    animation: fadeUp 0.9s ease 0.55s both;
  }
  .btn-outline {
    padding: 14px 32px; border-radius: 50px;
    border: 1px solid var(--gold); background: transparent;
    color: var(--gold); font-weight: 600; letter-spacing: 1.5px;
    font-size: 13px; text-transform: uppercase; cursor: pointer;
    transition: all 0.4s ease;
  }
  .btn-outline:hover { background: var(--gold); color: var(--black); transform: translateY(-3px); }

  /* Search bar */
  .hero-search {
    margin: 60px auto 0; max-width: 720px;
    display: flex; align-items: center;
    background: rgba(20, 20, 20, 0.8);
    border: 1px solid var(--border);
    border-radius: 60px; padding: 8px;
    backdrop-filter: blur(20px);
    animation: fadeUp 0.9s ease 0.7s both;
    transition: border-color 0.3s, box-shadow 0.3s;
  }
  .hero-search:focus-within {
    border-color: var(--gold);
    box-shadow: 0 0 40px rgba(212, 175, 55, 0.15);
  }
  .hero-search input {
    flex: 1; background: transparent; border: none; outline: none;
    padding: 16px 24px; color: var(--cream); font-size: 15px;
  }
  .hero-search input::placeholder { color: var(--text-muted); }
  .hero-search .btn-gold { padding: 14px 30px; }

  /* ============ STATS ============ */
  .stats {
    display: grid; grid-template-columns: repeat(4, 1fr);
    border-top: 1px solid var(--border);
    border-bottom: 1px solid var(--border);
    background: var(--charcoal);
  }
  .stat {
    padding: 50px 30px; text-align: center;
    border-right: 1px solid var(--border);
    transition: background 0.4s;
  }
  .stat:last-child { border-right: none; }
  .stat:hover { background: var(--charcoal-2); }
  .stat h3 {
    font-family: var(--font-serif); font-size: 52px; font-weight: 600;
    background: linear-gradient(135deg, var(--gold-light), var(--gold));
    -webkit-background-clip: text; -webkit-text-fill-color: transparent;
    line-height: 1;
  }
  .stat p {
    font-size: 12px; letter-spacing: 3px; text-transform: uppercase;
    color: var(--text-muted); margin-top: 12px;
  }

  /* ============ SECTION HEADING ============ */
  .section { padding: 120px 60px; }
  .section-head {
    text-align: center; margin-bottom: 70px;
  }
  .section-tag {
    font-size: 12px; letter-spacing: 5px; text-transform: uppercase;
    color: var(--gold); margin-bottom: 18px; display: block;
  }
  .section-head h2 {
    font-family: var(--font-serif);
    font-size: clamp(38px, 5vw, 64px);
    font-weight: 600; line-height: 1.1;
  }
  .section-head h2 .italic {
    font-style: italic; font-weight: 300;
    color: var(--gold);
  }
  .section-head p {
    color: var(--text-muted); margin-top: 18px; max-width: 560px;
    margin-left: auto; margin-right: auto; font-size: 15px;
  }

  /* ============ CATEGORIES ============ */
  .categories-grid {
    display: grid; grid-template-columns: repeat(4, 1fr);
    gap: 22px;
  }
  .category-card {
    position: relative; overflow: hidden; border-radius: 16px;
    height: 340px; cursor: pointer;
    border: 1px solid var(--border);
    background-size: cover; background-position: center;
    transition: transform 0.5s ease, box-shadow 0.5s ease;
  }
  .category-card::before {
    content: ''; position: absolute; inset: 0;
    background: linear-gradient(180deg, rgba(10,10,10,0.1) 0%, rgba(10,10,10,0.9) 100%);
    transition: opacity 0.4s;
  }
  .category-card:hover { transform: translateY(-8px); box-shadow: 0 20px 50px rgba(212,175,55,0.2); }
  .category-card:hover::before { opacity: 0.7; }
  .category-card .content {
    position: absolute; bottom: 0; left: 0; right: 0;
    padding: 28px; z-index: 2;
  }
  .category-card .content h3 {
    font-family: var(--font-serif); font-size: 26px; font-weight: 600;
    transition: color 0.3s;
  }
  .category-card:hover .content h3 { color: var(--gold); }
  .category-card .content span {
    font-size: 12px; letter-spacing: 2px; text-transform: uppercase;
    color: var(--gold-light); opacity: 0.85;
  }
  .category-card .arrow {
    position: absolute; top: 24px; right: 24px;
    width: 44px; height: 44px; border-radius: 50%;
    background: rgba(212,175,55,0.15); backdrop-filter: blur(10px);
    border: 1px solid var(--border);
    display: flex; align-items: center; justify-content: center;
    color: var(--gold); opacity: 0; transform: scale(0.6);
    transition: all 0.4s;
  }
  .category-card:hover .arrow { opacity: 1; transform: scale(1); }

  /* ============ PRODUCTS ============ */
  .products-section { background: var(--charcoal); }
  .products-grid {
    display: grid; grid-template-columns: repeat(4, 1fr);
    gap: 26px;
  }
  .product-card {
    background: var(--charcoal-2); border-radius: 18px;
    overflow: hidden; border: 1px solid var(--border);
    transition: all 0.4s ease;
  }
  .product-card:hover {
    transform: translateY(-8px);
    border-color: var(--gold);
    box-shadow: 0 20px 50px rgba(0,0,0,0.5);
  }
  .product-img {
    height: 260px; background-size: cover; background-position: center;
    position: relative; overflow: hidden;
  }
  .product-img::after {
    content: ''; position: absolute; inset: 0;
    background: linear-gradient(180deg, transparent 60%, rgba(0,0,0,0.6) 100%);
    transition: opacity 0.4s;
  }
  .product-img .tag {
    position: absolute; top: 16px; left: 16px; z-index: 2;
    padding: 6px 14px; border-radius: 50px;
    background: linear-gradient(135deg, var(--gold-light), var(--gold));
    color: var(--black); font-size: 11px; font-weight: 700;
    letter-spacing: 1px; text-transform: uppercase;
  }
  .product-info { padding: 22px; }
  .product-cat {
    font-size: 11px; letter-spacing: 2px; text-transform: uppercase;
    color: var(--gold); opacity: 0.9;
  }
  .product-info h3 {
    font-family: var(--font-serif); font-size: 22px; font-weight: 600;
    margin: 8px 0 12px; transition: color 0.3s;
  }
  .product-card:hover .product-info h3 { color: var(--gold-light); }
  .product-meta {
    display: flex; align-items: center; justify-content: space-between;
    padding-top: 14px; border-top: 1px solid var(--border);
  }
  .price {
    font-family: var(--font-serif); font-size: 22px; font-weight: 600;
    color: var(--gold-light);
  }
  .price small { font-size: 12px; color: var(--text-muted); font-family: var(--font-sans); }
  .rating { color: var(--gold); font-size: 13px; letter-spacing: 2px; }

  /* ============ WHY US ============ */
  .why-grid {
    display: grid; grid-template-columns: repeat(3, 1fr);
    gap: 26px;
  }
  .why-card {
    padding: 44px 36px; border-radius: 18px;
    background: linear-gradient(145deg, var(--charcoal-2), var(--charcoal));
    border: 1px solid var(--border);
    position: relative; overflow: hidden;
    transition: all 0.4s ease;
  }
  .why-card::before {
    content: ''; position: absolute; top: 0; left: 0;
    width: 100%; height: 2px;
    background: linear-gradient(90deg, transparent, var(--gold), transparent);
    transform: scaleX(0); transition: transform 0.5s ease;
  }
  .why-card:hover { transform: translateY(-6px); border-color: rgba(212,175,55,0.5); }
  .why-card:hover::before { transform: scaleX(1); }
  .why-icon {
    width: 68px; height: 68px; border-radius: 16px;
    background: rgba(212, 175, 55, 0.1);
    border: 1px solid var(--border);
    display: flex; align-items: center; justify-content: center;
    color: var(--gold); margin-bottom: 26px;
    transition: all 0.4s;
  }
  .why-card:hover .why-icon {
    background: var(--gold); color: var(--black);
    transform: rotate(-8deg) scale(1.05);
  }
  .why-card h3 {
    font-family: var(--font-serif); font-size: 24px; font-weight: 600;
    margin-bottom: 12px;
  }
  .why-card p { color: var(--text-muted); font-size: 14px; line-height: 1.8; }

  /* ============ CTA BANNER ============ */
  .cta-banner {
    margin: 0 60px; padding: 90px 60px; border-radius: 28px;
    background:
      radial-gradient(ellipse at 30% 20%, rgba(212,175,55,0.25) 0%, transparent 60%),
      radial-gradient(ellipse at 70% 80%, rgba(212,175,55,0.15) 0%, transparent 60%),
      linear-gradient(135deg, #1a1508, #0a0a0a);
    border: 1px solid var(--border);
    text-align: center; position: relative; overflow: hidden;
  }
  .cta-banner::before {
    content: ''; position: absolute; inset: 0;
    background-image:
      linear-gradient(rgba(212,175,55,0.05) 1px, transparent 1px),
      linear-gradient(90deg, rgba(212,175,55,0.05) 1px, transparent 1px);
    background-size: 50px 50px;
    mask-image: radial-gradient(ellipse at center, black, transparent 70%);
  }
  .cta-banner > * { position: relative; z-index: 2; }
  .cta-banner h2 {
    font-family: var(--font-serif); font-size: clamp(36px, 5vw, 62px);
    font-weight: 600; line-height: 1.1; margin-bottom: 20px;
  }
  .cta-banner h2 .italic { font-style: italic; color: var(--gold); font-weight: 300; }
  .cta-banner p { color: var(--text-muted); max-width: 580px; margin: 0 auto 40px; }

  /* ============ TESTIMONIALS ============ */
  .testimonials-grid {
    display: grid; grid-template-columns: repeat(3, 1fr); gap: 26px;
  }
  .testimonial {
    padding: 40px 32px; border-radius: 18px;
    background: var(--charcoal-2);
    border: 1px solid var(--border);
    transition: all 0.4s;
  }
  .testimonial:hover { border-color: rgba(212,175,55,0.5); transform: translateY(-6px); }
  .stars { color: var(--gold); letter-spacing: 3px; margin-bottom: 18px; }
  .testimonial p {
    font-family: var(--font-serif); font-size: 19px; font-style: italic;
    line-height: 1.7; color: var(--cream); margin-bottom: 26px;
  }
  .author { display: flex; align-items: center; gap: 14px; }
  .avatar {
    width: 52px; height: 52px; border-radius: 50%;
    background: linear-gradient(135deg, var(--gold-light), var(--gold-dark));
    display: flex; align-items: center; justify-content: center;
    font-weight: 700; color: var(--black); font-family: var(--font-serif);
    font-size: 20px;
  }
  .author-info h4 { font-size: 15px; font-weight: 600; }
  .author-info span { font-size: 12px; color: var(--text-muted); letter-spacing: 1px; }

  /* ============ NEWSLETTER ============ */
  .newsletter {
    padding: 80px 60px; text-align: center;
    border-top: 1px solid var(--border);
    background: var(--charcoal);
  }
  .newsletter h3 {
    font-family: var(--font-serif); font-size: 42px; font-weight: 600;
    margin-bottom: 14px;
  }
  .newsletter p { color: var(--text-muted); margin-bottom: 36px; }
  .newsletter-form {
    display: flex; max-width: 540px; margin: 0 auto;
    background: var(--charcoal-2); border: 1px solid var(--border);
    border-radius: 60px; padding: 8px;
  }
  .newsletter-form input {
    flex: 1; background: transparent; border: none; outline: none;
    padding: 14px 24px; color: var(--cream); font-size: 15px;
  }
  .newsletter-form input::placeholder { color: var(--text-muted); }

  /* ============ FOOTER ============ */
  footer {
    padding: 80px 60px 40px;
    background: var(--black);
    border-top: 1px solid var(--border);
  }
  .footer-top {
    display: grid; grid-template-columns: 2fr 1fr 1fr 1fr; gap: 50px;
    margin-bottom: 60px;
  }
  .footer-brand .logo { font-size: 34px; margin-bottom: 20px; display: inline-block; }
  .footer-brand p { color: var(--text-muted); font-size: 14px; max-width: 340px; line-height: 1.8; }
  .socials { display: flex; gap: 12px; margin-top: 26px; }
  .socials a {
    width: 42px; height: 42px; border-radius: 50%;
    border: 1px solid var(--border);
    display: flex; align-items: center; justify-content: center;
    transition: all 0.3s; color: var(--cream);
  }
  .socials a:hover { background: var(--gold); color: var(--black); border-color: var(--gold); transform: translateY(-3px); }
  .footer-col h4 {
    font-size: 13px; letter-spacing: 3px; text-transform: uppercase;
    color: var(--gold); margin-bottom: 24px; font-weight: 600;
  }
  .footer-col ul { list-style: none; }
  .footer-col li { margin-bottom: 12px; }
  .footer-col a {
    color: var(--text-muted); font-size: 14px;
    transition: color 0.3s;
  }
  .footer-col a:hover { color: var(--gold); }
  .footer-bottom {
    display: flex; justify-content: space-between; align-items: center;
    padding-top: 30px; border-top: 1px solid var(--border);
    color: var(--text-muted); font-size: 13px;
    flex-wrap: wrap; gap: 16px;
  }

  /* ============ ANIMATIONS ============ */
  @keyframes fadeUp {
    from { opacity: 0; transform: translateY(30px); }
    to { opacity: 1; transform: translateY(0); }
  }
  .reveal {
    opacity: 0; transform: translateY(40px);
    transition: opacity 0.8s ease, transform 0.8s ease;
  }
  .reveal.visible { opacity: 1; transform: translateY(0); }

  /* ============ RESPONSIVE ============ */
  @media (max-width: 1100px) {
    .categories-grid, .products-grid { grid-template-columns: repeat(2, 1fr); }
    .why-grid, .testimonials-grid { grid-template-columns: repeat(2, 1fr); }
    .footer-top { grid-template-columns: 1fr 1fr; }
    .stats { grid-template-columns: repeat(2, 1fr); }
    .stat:nth-child(2) { border-right: none; }
  }
  @media (max-width: 860px) {
    .navbar { padding: 18px 24px; }
    .navbar.scrolled { padding: 12px 24px; }
    .nav-links { display: none; }
    .section { padding: 80px 24px; }
    .cta-banner { margin: 0 24px; padding: 60px 24px; }
    .newsletter { padding: 60px 24px; }
    footer { padding: 60px 24px 30px; }
    .hero { padding: 120px 24px 60px; }
  }
  @media (max-width: 640px) {
    .categories-grid, .products-grid, .why-grid, .testimonials-grid, .footer-top {
      grid-template-columns: 1fr;
    }
    .stats { grid-template-columns: 1fr; }
    .stat { border-right: none; border-bottom: 1px solid var(--border); }
    .hero-search { flex-direction: column; border-radius: 20px; padding: 14px; }
    .hero-search input { padding: 14px; width: 100%; }
    .hero-search .btn-gold { width: 100%; }
    .newsletter-form { flex-direction: column; border-radius: 20px; padding: 14px; }
    .newsletter-form input { padding: 14px; }
    .footer-bottom { flex-direction: column; text-align: cen
